<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" font-family="Georgia, 'Times New Roman', serif">
  <rect width="880" height="200" fill="#F7F6F2"/>
  <!-- a claim photo with a doctored patch, and the detector's window over it -->
  <g transform="translate(640,34)">
    <rect width="190" height="132" fill="#FFFFFF" stroke="#C9C6BC"/>
    <path d="M0 92 L190 92" stroke="#DDD9CE"/>
    <rect x="22" y="58" width="60" height="34" fill="none" stroke="#C9C6BC"/>
    <rect x="118" y="40" width="44" height="52" fill="none" stroke="#C9C6BC"/>
    <path d="M70 104 q14 -10 28 0 q14 9 26 -2 q10 -8 18 3 q-8 14 -34 12 q-26 2 -38 -13z" fill="#B4552D" opacity="0.75"/>
    <rect x="58" y="84" width="96" height="44" fill="none" stroke="#1E4D8C" stroke-width="2" stroke-dasharray="5 4"/>
  </g>
  <text x="40" y="92" font-size="40" fill="#1E4D8C">ClaimShield</text>
  <text x="40" y="128" font-size="17" fill="#2B2B2B">Spotting doctored photos in short-term-rental damage claims,</text>
  <text x="40" y="152" font-size="17" fill="#2B2B2B">and showing where the edit is.</text>
</svg>
