<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Truvix mark: a lens over a 3x3 pixel grid; one pixel is the edit it found -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#1E4D8C"/>
  <g fill="#DCE5F2" opacity="0.9">
    <rect x="15" y="15" width="9" height="9" rx="1.5"/><rect x="27.5" y="15" width="9" height="9" rx="1.5"/><rect x="40" y="15" width="9" height="9" rx="1.5"/>
    <rect x="15" y="27.5" width="9" height="9" rx="1.5"/><rect x="40" y="27.5" width="9" height="9" rx="1.5"/>
    <rect x="15" y="40" width="9" height="9" rx="1.5"/><rect x="27.5" y="40" width="9" height="9" rx="1.5"/><rect x="40" y="40" width="9" height="9" rx="1.5"/>
  </g>
  <rect x="27.5" y="27.5" width="9" height="9" rx="1.5" fill="#E07A4F"/>
  <circle cx="32" cy="32" r="10.5" fill="none" stroke="#FFFFFF" stroke-width="2.6"/>
  <line x1="39.6" y1="39.6" x2="47" y2="47" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
</svg>
